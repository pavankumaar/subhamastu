# Render Blueprint for the Subhamastu API (the frontend is a static build published to here.now).
# Secrets are marked sync: false so Render asks for them in the dashboard; they never live in git.
services:
  - type: web
    name: subhamastu-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: wedding_planner
      - key: CORS_ORIGINS
        sync: false
      - key: ASSISTANT_DAILY_LIMIT_PER_USER
        value: "50"
      - key: GOOGLE_CLIENT_ID
        sync: false
